<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - {{settings.store_name}}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="announcement-bar">{{settings.announcement_bar}}</div>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">{{settings.store_name}}</a>
      <nav><ul class="nav-menu">
        <li><a href="/">Home</a></li>
        <li><a href="/products">Products</a></li>
        <li><a href="/track-order">Track Order</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul></nav>
      <div class="header-actions">
        <a href="/cart" class="cart-link"><span>Cart</span><span class="cart-count" id="cart-count" style="display:none;">0</span></a>
      </div>
    </div>
  </header>

  <div class="container" style="padding:48px 20px;">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:24px;">
      <div>
        <h1 style="font-size:1.9em; margin-bottom:6px;">My Account</h1>
        <p style="color:#667;">Signed in as <strong id="account-email"></strong></p>
      </div>
      <form method="POST" action="/account/logout">
        <button type="submit" class="btn btn-secondary">Sign out</button>
      </form>
    </div>

    <div class="admin-card" style="background:#fff; border:1px solid #e6e6e6; border-radius:10px; overflow:hidden;">
      <div style="padding:18px 20px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
        <h2 style="font-size:1.15em;">Your orders</h2>
        <a href="/products" class="btn btn-secondary" style="padding:8px 14px; font-size:13px;">Continue shopping</a>
      </div>
      <div id="orders-body" style="padding:8px 20px 20px;"></div>
    </div>
  </div>

  <footer class="footer"><div class="footer-bottom">{{settings.store_footer_text}}</div></footer>
  <script src="/js/store.js"></script>
  <script>
    const customer = {{data:json:customer}};
    const orders = {{data:json:orders}};

    function esc(value) {
      return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    document.getElementById('account-email').textContent = (customer && customer.email) || '';

    const body = document.getElementById('orders-body');
    if (!orders || orders.length === 0) {
      body.innerHTML = '<p style="color:#667; padding:24px 0;">You have not placed any orders yet.</p>';
    } else {
      body.innerHTML = orders.map(function (order) {
        const date = order.created_at ? new Date(order.created_at).toLocaleDateString() : '';
        return '' +
          '<div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid #f0f0f0;">' +
            '<div style="min-width:180px;">' +
              '<div style="font-weight:600;">' + esc(order.order_number) + '</div>' +
              '<div style="font-size:13px; color:#777;">' + esc(date) + '</div>' +
            '</div>' +
            '<div style="font-size:13px; color:#555;">Status: ' + esc(order.status) + ' · Payment: ' + esc(order.payment_status) + '</div>' +
            '<div style="font-weight:600;">$' + Number(order.total || 0).toFixed(2) + '</div>' +
            '<a class="btn btn-secondary" style="padding:8px 14px; font-size:13px;" href="/account/orders/' + encodeURIComponent(order.order_number) + '">View details</a>' +
          '</div>';
      }).join('');
    }
  </script>
</body>
</html>
