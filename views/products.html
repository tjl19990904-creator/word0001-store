<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - {{settings.store_name}}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="announcement-bar">{{settings.announcement_bar}}</div>

  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">{{settings.store_name}}</a>
      <nav>
        <ul class="nav-menu">
          <li><a href="/">Home</a></li>
          <li><a href="/products">Products</a></li>
          <li><a href="/track-order">Track Order</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="/cart" class="cart-link">
          <span>Cart</span>
          <span class="cart-count" id="cart-count" style="display:none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="container" style="margin-top: 30px;">
    <div class="section-title">
      <h2>All Products</h2>
      <p>Browse our complete collection</p>
    </div>

    <!-- Category Filter & Search -->
    <div style="display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; align-items:center;">
      <form method="GET" action="/products" style="display:flex; gap:8px; flex:1;">
        <input type="text" name="search" placeholder="Search products..." value="{{data.search}}" 
               style="flex:1; padding:10px 14px; border:1px solid #e0e0e0; border-radius:8px; font-size:14px;">
        <button type="submit" class="btn btn-primary">Search</button>
      </form>
      <select id="category-filter" onchange="window.location.href=this.value" 
              style="padding:10px 14px; border:1px solid #e0e0e0; border-radius:8px; font-size:14px;">
        <option value="/products">All Categories</option>
      </select>
    </div>

    <div class="product-grid" id="product-grid"></div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
  </div>

  <footer class="footer">
    <div class="footer-bottom">{{settings.store_footer_text}}</div>
  </footer>

  <script src="/js/store.js"></script>
  <script>
    const products = {{data:json:products}};
    const categories = {{data:json:categories}};
    const currentPage = {{data.currentPage}};
    const totalPages = {{data.totalPages}};
    const selectedCategory = "{{data.selectedCategory}}";
    const searchQuery = "{{data.search}}";

    // Populate categories
    const catFilter = document.getElementById('category-filter');
    if (catFilter && categories.length > 0) {
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = '/products?category=' + c.id + (searchQuery ? '&search=' + searchQuery : '');
        opt.textContent = c.name;
        if (String(selectedCategory) === String(c.id)) opt.selected = true;
        catFilter.appendChild(opt);
      });
    }

    // Render products
    const grid = document.getElementById('product-grid');
    if (grid) {
      if (products.length > 0) {
        grid.innerHTML = products.map(p => `
          <div class="product-card">
            ${p.compare_price ? '<span class="badge sale">SALE</span>' : ''}
            <div class="product-image">
              <a href="/products/${p.slug}">
                <img src="${p.primary_image}" alt="${p.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22300%22 height=%22300%22/%3E%3Ctext x=%22150%22 y=%22150%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-size=%2216%22%3ENo Image%3C/text%3E%3C/svg%3E'">
              </a>
            </div>
            <div class="product-info">
              <div class="product-name"><a href="/products/${p.slug}">${p.name}</a></div>
              ${p.short_description ? `<div class="product-short-desc">${p.short_description}</div>` : ''}
              <div style="margin-bottom:12px;">
                <span class="product-price">$${p.price.toFixed(2)}</span>
                ${p.compare_price ? `<span class="compare-price">$${p.compare_price.toFixed(2)}</span>` : ''}
              </div>
              <button class="btn-add-cart" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
          </div>
        `).join('');
      } else {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#999; padding:40px;">No products found.</p>';
      }
    }

    // Render pagination
    const pagEl = document.getElementById('pagination');
    if (pagEl && totalPages > 1) {
      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        const params = new URLSearchParams();
        if (selectedCategory) params.set('category', selectedCategory);
        if (searchQuery) params.set('search', searchQuery);
        params.set('page', i);
        html += `<a href="/products?${params.toString()}" class="${i === currentPage ? 'active' : ''}">${i}</a>`;
      }
      pagEl.innerHTML = html;
    }
  </script>
</body>
</html>
