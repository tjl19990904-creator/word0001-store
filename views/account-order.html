<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{data.pageTitle}} - {{settings.store_name}}</title>
  <link rel="canonical" href="{{canonicalUrl}}">
  <meta name="robots" content="noindex,follow">
  <link rel="alternate" hreflang="en" href="{{altEnUrl}}">
  <link rel="alternate" hreflang="zh-CN" href="{{altZhUrl}}">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="announcement-bar">{{settings.announcement_bar}}</div>
  <header class="header">
    <div class="header-inner">
      <a href="{{homeUrl}}" class="logo">{{settings.store_name}}</a>
      <nav><ul class="nav-menu">
        <li><a href="/">{{t:nav.home}}</a></li>
        <li><a href="/products">{{t:nav.products}}</a></li>
        <li><a href="/track-order">{{t:nav.trackOrder}}</a></li>
        <li><a href="/about">{{t:nav.about}}</a></li>
        <li><a href="/contact">{{t:nav.contact}}</a></li>
      </ul></nav>
      <div class="header-actions">
        <a href="/cart" class="cart-link"><span>{{t:nav.cart}}</span><span class="cart-count" id="cart-count" style="display:none;">0</span></a>
        {{> lang-switcher}}
      </div>
    </div>
  </header>

  <div class="container" style="padding:48px 20px; max-width:820px;">
    <a href="/account" style="font-size:14px; color:#2e7d32;">&larr; {{t:account.backToAccount}}</a>
    <h1 id="order-title" style="font-size:1.8em; margin:14px 0 24px;"></h1>
    <div id="order-body"></div>
  </div>

  <footer class="footer"><div class="footer-bottom">{{settings.store_footer_text}}</div></footer>
  <script>window.I18N = {{data:json:clientDictionary}};</script>
  <script src="/js/store.js"></script>
  <script>
    const order = {{data:json:order}};
    const orderItems = {{data:json:orderItems}};
    const shipment = {{data:json:shipment}};
    const payUrl = {{data:json:payUrl}};

    function esc(value) {
      return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Fall back to the raw database value when a status has no translation.
    function statusLabel(group, value) {
      const key = 'status.' + group + '.' + value;
      const label = tr(key, '');
      return label && label !== key ? label : value;
    }

    function row(label, value) {
      return '<div style="display:flex; gap:12px; padding:8px 0; border-bottom:1px solid #f2f2f2;">' +
        '<span style="min-width:150px; color:#667;">' + esc(label) + '</span>' +
        '<span style="color:#223;">' + esc(value) + '</span></div>';
    }

    document.getElementById('order-title').textContent = tr('account.orderTitle') + ' ' + (order ? order.order_number : '');

    if (!order) {
      document.getElementById('order-body').innerHTML = '<p>' + esc(tr('account.orderNotFound')) + '</p>';
    } else {
      let html = '<div style="background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:20px 22px; margin-bottom:20px;">';
      html += row(tr('account.orderNumber'), order.order_number);
      html += row(tr('account.placedOn'), order.created_at ? new Date(order.created_at).toLocaleString() : '');
      html += row(tr('account.status'), statusLabel('order', order.status));
      html += row(tr('account.paymentStatus'), statusLabel('pay', order.payment_status));
      html += row(tr('account.paymentMethod'), order.payment_method || '');
      html += row(tr('account.shipTo'), order.shipping_address || '');
      html += row(tr('account.total'), '$' + Number(order.total || 0).toFixed(2));
      html += '</div>';

      if (order.payment_status === 'failed' && order.status !== 'cancelled') {
        html += '<div style="background:#fef3f2; border:1px solid #fecdca; color:#b42318; border-radius:10px; padding:16px 18px; margin-bottom:20px; font-size:14px;">' +
          '<strong>' + esc(tr('account.paymentFailedTitle')) + '</strong><br>' +
          esc(order.payment_failure_message || tr('common.defaultDecline')) +
          (order.payment_failure_decline_code ? ' (code: ' + esc(order.payment_failure_decline_code) + ')' : '') +
          '<br><span style="color:#7a271a;">' + esc(tr('account.paymentFailedHint')) + '</span>' +
          '</div>';
      }

      if (payUrl && order.payment_status !== 'paid' && order.status !== 'cancelled') {
        html += '<div style="margin-bottom:20px;">' +
          '<a class="btn btn-primary" style="padding:12px 22px; font-size:15px;" href="' + esc(payUrl) + '">' +
          esc(tr('account.payNow')) + ' — $' + Number(order.total || 0).toFixed(2) + '</a>' +
          '</div>';
      }

      html += '<div style="background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:20px 22px; margin-bottom:20px;">';
      html += '<h3 style="margin-bottom:12px;">' + esc(tr('account.items')) + '</h3>';
      (orderItems || []).forEach(function (item) {
        html += '<div style="display:flex; gap:12px; padding:10px 0; border-bottom:1px solid #f2f2f2; align-items:center;">' +
          '<div style="flex:1;">' +
            '<div style="font-weight:600;">' + esc(item.product_name) + '</div>' +
            '<div style="font-size:13px; color:#777;">' + esc(tr('account.qty')) + ' ' + esc(item.quantity) + ' × $' + Number(item.price || 0).toFixed(2) + '</div>' +
          '</div>' +
          '<div style="font-weight:600;">$' + Number(item.total || 0).toFixed(2) + '</div>' +
        '</div>';
      });
      html += '</div>';

      if (shipment) {
        html += '<div style="background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:20px 22px;">';
        html += '<h3 style="margin-bottom:12px;">' + esc(tr('account.shipping')) + '</h3>';
        html += row(tr('account.carrier'), shipment.carrier || tr('account.notAssigned'));
        html += row(tr('account.trackingNumber'), shipment.tracking_number || tr('account.notAvailableYet'));
        html += row(tr('account.shippingStatus'), statusLabel('order', shipment.status));
        html += '</div>';
      }

      document.getElementById('order-body').innerHTML = html;
    }
  </script>
</body>
</html>
