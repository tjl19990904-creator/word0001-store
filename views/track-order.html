<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order - {{settings.store_name}}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="announcement-bar">{{settings.announcement_bar}}</div>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">{{settings.store_name}}</a>
      <nav><ul class="nav-menu">
        <li><a href="/">Home</a></li>
        <li><a href="/products">Products</a></li>
        <li><a href="/track-order">Track Order</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul></nav>
      <div class="header-actions">
        <a href="/cart" class="cart-link"><span>Cart</span><span class="cart-count" id="cart-count" style="display:none;">0</span></a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="track-order-page">
      <h1>Track Your Order</h1>
      <div class="track-form">
        <form method="GET" action="/track-order">
          <input type="text" name="order_number" placeholder="Enter your order number (e.g., ORD-...)" 
                 value="{{data.searchedOrderNumber}}" required>
          <button type="submit" class="btn btn-primary">Track</button>
        </form>
      </div>
      <div id="order-result"></div>
    </div>
  </div>

  <footer class="footer"><div class="footer-bottom">{{settings.store_footer_text}}</div></footer>
  <script src="/js/store.js"></script>
  <script>
    const order = {{data:json:order}};
    const orderItems = {{data:json:orderItems}};
    const shipment = {{data:json:shipment}};
    const trackingHistory = {{data:json:trackingHistory}};
    const searchedOrderNumber = "{{data.searchedOrderNumber}}";

    const resultEl = document.getElementById('order-result');
    
    if (searchedOrderNumber && !order) {
      resultEl.innerHTML = `
        <div class="order-info-card" style="text-align:center;">
          <h3>Order Not Found</h3>
          <p style="color:#999; margin-top:12px;">We couldn't find an order with the number "${searchedOrderNumber}". Please check and try again.</p>
        </div>
      `;
    } else if (order) {
      let html = `
        <div class="order-info-card">
          <h3>Order Details</h3>
          <div class="order-info-row"><span><strong>Order Number:</strong></span><span>${order.order_number}</span></div>
          <div class="order-info-row"><span><strong>Date:</strong></span><span>${new Date(order.created_at).toLocaleDateString()}</span></div>
          <div class="order-info-row"><span><strong>Status:</strong></span><span class="badge ${order.status === 'delivered' ? 'badge-success' : order.status === 'shipped' ? 'badge-info' : 'badge-warning'}">${order.status}</span></div>
          <div class="order-info-row"><span><strong>Payment:</strong></span><span>${order.payment_status}</span></div>
          <div class="order-info-row"><span><strong>Total:</strong></span><span>$${order.total.toFixed(2)}</span></div>
          <div class="order-info-row"><span><strong>Customer:</strong></span><span>${order.customer_name}</span></div>
          <div class="order-info-row"><span><strong>Email:</strong></span><span>${order.customer_email}</span></div>
          <div class="order-info-row"><span><strong>Ship To:</strong></span><span>${order.shipping_address}</span></div>
        </div>

        <div class="order-info-card">
          <h3>Order Items</h3>
          ${orderItems.map(item => `
            <div style="display:flex; gap:12px; padding:8px 0; border-bottom:1px solid #e0e0e0;">
              <img src="${item.product_image || ''}" alt="${item.product_name}" style="width:50px;height:50px;object-fit:cover;border-radius:4px;"
                   onerror="this.style.display='none'">
              <div style="flex:1;">
                <div style="font-weight:600;">${item.product_name}</div>
                <div style="font-size:13px; color:#666;">Qty: ${item.quantity} x $${item.price.toFixed(2)}</div>
              </div>
              <div style="font-weight:600;">$${item.total.toFixed(2)}</div>
            </div>
          `).join('')}
        </div>
      `;

      if (shipment) {
        html += `
          <div class="order-info-card">
            <h3>Shipping & Tracking</h3>
            <div class="order-info-row"><span><strong>Carrier:</strong></span><span>${shipment.carrier || 'Not assigned'}</span></div>
            <div class="order-info-row"><span><strong>Tracking Number:</strong></span><span>${shipment.tracking_number || 'Not available yet'}</span></div>
            <div class="order-info-row"><span><strong>Shipping Status:</strong></span><span class="badge ${shipment.status === 'delivered' ? 'badge-success' : shipment.status === 'shipped' ? 'badge-info' : 'badge-warning'}">${shipment.status}</span></div>
            ${shipment.shipped_at ? `<div class="order-info-row"><span><strong>Shipped Date:</strong></span><span>${new Date(shipment.shipped_at).toLocaleDateString()}</span></div>` : ''}
            ${shipment.delivered_at ? `<div class="order-info-row"><span><strong>Delivered Date:</strong></span><span>${new Date(shipment.delivered_at).toLocaleDateString()}</span></div>` : ''}
            ${shipment.estimated_delivery ? `<div class="order-info-row"><span><strong>Est. Delivery:</strong></span><span>${new Date(shipment.estimated_delivery).toLocaleDateString()}</span></div>` : ''}
        `;
        
        if (trackingHistory && trackingHistory.length > 0) {
          html += `
            <h4 style="margin:20px 0 12px;">Tracking History</h4>
            <div class="tracking-timeline">
              ${trackingHistory.map((event, i) => `
                <div class="tracking-event ${i === 0 ? 'active' : ''}">
                  <div class="event-status">${event.status}</div>
                  <div class="event-time">${new Date(event.timestamp).toLocaleString()}</div>
                  ${event.location ? `<div class="event-desc">Location: ${event.location}</div>` : ''}
                  ${event.description ? `<div class="event-desc">${event.description}</div>` : ''}
                </div>
              `).join('')}
            </div>
          `;
        }
        
        html += `</div>`;
      }

      resultEl.innerHTML = html;
    }
  </script>
</body>
</html>
