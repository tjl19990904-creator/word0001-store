<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{t:track.title}} - {{settings.store_name}}</title>
  <link rel="canonical" href="{{canonicalUrl}}">
  <link rel="alternate" hreflang="en" href="{{altEnUrl}}">
  <link rel="alternate" hreflang="zh-CN" href="{{altZhUrl}}">
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="announcement-bar">{{settings.announcement_bar}}</div>
  <header class="header">
    <div class="header-inner">
      <a href="{{homeUrl}}" class="logo">{{settings.store_name}}</a>
      <nav><ul class="nav-menu">
        <li><a href="/">{{t:nav.home}}</a></li>
        <li><a href="/products">{{t:nav.products}}</a></li>
        <li><a href="/track-order">{{t:nav.trackOrder}}</a></li>
        <li><a href="/about">{{t:nav.about}}</a></li>
        <li><a href="/contact">{{t:nav.contact}}</a></li>
      </ul></nav>
      <div class="header-actions">
        <a href="/cart" class="cart-link"><span>{{t:nav.cart}}</span><span class="cart-count" id="cart-count" style="display:none;">0</span></a>
        {{> lang-switcher}}
      </div>
    </div>
  </header>

  <div class="container">
    <div class="track-order-page">
      <h1>{{t:track.title}}</h1>
      <div class="track-form">
        <form method="GET" action="/track-order">
          <input type="text" name="order_number" placeholder="{{t:track.placeholder}}"
                 value="{{data.searchedOrderNumber}}" required>
          <button type="submit" class="btn btn-primary">{{t:track.button}}</button>
        </form>
      </div>
      <div id="order-result"></div>
    </div>
  </div>

  <footer class="footer"><div class="footer-bottom">{{settings.store_footer_text}}</div></footer>
  <script>window.I18N = {{data:json:clientDictionary}};</script>
  <script src="/js/store.js"></script>
  <script>
    const order = {{data:json:order}};
    const orderItems = {{data:json:orderItems}};
    const shipment = {{data:json:shipment}};
    const trackingHistory = {{data:json:trackingHistory}};
    const searchedOrderNumber = {{data:json:searchedOrderNumber}};
    const LOCALE = '{{lang}}';

    const resultEl = document.getElementById('order-result');

    const esc = (value) => String(value === undefined || value === null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    const money = (value) => Number(value || 0).toFixed(2);

    function statusLabel(group, value) {
      const key = 'status.' + group + '.' + value;
      const label = tr(key, '');
      return label && label !== key ? label : value;
    }

    function statusBadge(group, value) {
      const cls = value === 'delivered' ? 'badge-success' : value === 'shipped' ? 'badge-info' : 'badge-warning';
      return `<span class="badge ${cls}">${esc(statusLabel(group, value))}</span>`;
    }

    function dateText(value) {
      if (!value) return '';
      const date = new Date(value);
      return isNaN(date.getTime()) ? '' : date.toLocaleDateString(LOCALE);
    }

    if (searchedOrderNumber && !order) {
      // Not found: covers both "no such order" and "belongs to someone else".
      resultEl.innerHTML = `
        <div class="order-info-card" style="text-align:center;">
          <h3>${esc(tr('track.notFoundTitle'))}</h3>
          <p style="color:#999; margin-top:12px;">${esc(tr('track.notFoundBody').replace('{number}', searchedOrderNumber))}</p>
        </div>
      `;
    } else if (order) {
      let html = `
        <div class="order-info-card">
          <h3>${esc(tr('track.details'))}</h3>
          <div class="order-info-row"><span><strong>${esc(tr('track.orderNumber'))}:</strong></span><span>${esc(order.order_number)}</span></div>
          <div class="order-info-row"><span><strong>${esc(tr('track.date'))}:</strong></span><span>${esc(dateText(order.created_at))}</span></div>
          <div class="order-info-row"><span><strong>${esc(tr('track.status'))}:</strong></span>${statusBadge('order', order.status)}</div>
          <div class="order-info-row"><span><strong>${esc(tr('track.payment'))}:</strong></span><span>${esc(statusLabel('pay', order.payment_status))}</span></div>
          <div class="order-info-row"><span><strong>${esc(tr('track.total'))}:</strong></span><span>$${money(order.total)}</span></div>
          <div class="order-info-row"><span><strong>${esc(tr('track.customer'))}:</strong></span><span>${esc(order.customer_name)}</span></div>
          <div class="order-info-row"><span><strong>${esc(tr('track.email'))}:</strong></span><span>${esc(order.customer_email)}</span></div>
          <div class="order-info-row"><span><strong>${esc(tr('track.shipTo'))}:</strong></span><span>${esc(order.shipping_address)}</span></div>
        </div>

        <div class="order-info-card">
          <h3>${esc(tr('track.items'))}</h3>
          ${orderItems.length > 0 ? orderItems.map(item => `
            <div style="display:flex; gap:12px; padding:8px 0; border-bottom:1px solid #e0e0e0;">
              <img src="${esc(item.product_image || '')}" alt="${esc(item.product_name)}" style="width:50px;height:50px;object-fit:cover;border-radius:4px;"
                   onerror="this.style.display='none'">
              <div style="flex:1;">
                <div style="font-weight:600;">${esc(item.product_name)}</div>
                <div style="font-size:13px; color:#666;">${esc(tr('track.qty'))}: ${esc(item.quantity)} × $${money(item.price)}</div>
              </div>
              <div style="font-weight:600;">$${money(item.total)}</div>
            </div>
          `).join('') : `<p style="color:#999;">${esc(tr('success.notAvailable'))}</p>`}
        </div>
      `;

      if (shipment) {
        html += `
          <div class="order-info-card">
            <h3>${esc(tr('track.shipping'))}</h3>
            <div class="order-info-row"><span><strong>${esc(tr('track.carrier'))}:</strong></span><span>${esc(shipment.carrier || tr('account.notAssigned'))}</span></div>
            <div class="order-info-row"><span><strong>${esc(tr('track.trackingNumber'))}:</strong></span><span>${esc(shipment.tracking_number || tr('account.notAvailableYet'))}</span></div>
            <div class="order-info-row"><span><strong>${esc(tr('track.shippingStatus'))}:</strong></span>${statusBadge('order', shipment.status)}</div>
            ${shipment.shipped_at ? `<div class="order-info-row"><span><strong>${esc(tr('track.shippedDate'))}:</strong></span><span>${esc(dateText(shipment.shipped_at))}</span></div>` : ''}
            ${shipment.delivered_at ? `<div class="order-info-row"><span><strong>${esc(tr('track.deliveredDate'))}:</strong></span><span>${esc(dateText(shipment.delivered_at))}</span></div>` : ''}
            ${shipment.estimated_delivery ? `<div class="order-info-row"><span><strong>${esc(tr('track.estDelivery'))}:</strong></span><span>${esc(dateText(shipment.estimated_delivery))}</span></div>` : ''}
        `;

        if (trackingHistory && trackingHistory.length > 0) {
          html += `
            <h4 style="margin:20px 0 12px;">${esc(tr('track.history'))}</h4>
            <div class="tracking-timeline">
              ${trackingHistory.map((event, i) => `
                <div class="tracking-event ${i === 0 ? 'active' : ''}">
                  <div class="event-status">${esc(statusLabel('order', event.status))}</div>
                  <div class="event-time">${esc(new Date(event.timestamp).toLocaleString(LOCALE))}</div>
                  ${event.location ? `<div class="event-desc">${esc(tr('track.location'))}: ${esc(event.location)}</div>` : ''}
                  ${event.description ? `<div class="event-desc">${esc(event.description)}</div>` : ''}
                </div>
              `).join('')}
            </div>
          `;
        }

        html += `</div>`;
      }

      resultEl.innerHTML = html;
    } else {
      // Initial empty state: nothing searched yet.
      resultEl.innerHTML = `
        <div class="order-info-card" style="text-align:center;">
          <p style="color:#777;">${esc(tr('track.hint'))}</p>
        </div>
      `;
    }
  </script>
</body>
</html>
