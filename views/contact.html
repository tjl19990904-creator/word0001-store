<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - {{settings.store_name}}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="announcement-bar">{{settings.announcement_bar}}</div>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">{{settings.store_name}}</a>
      <nav><ul class="nav-menu">
        <li><a href="/">Home</a></li>
        <li><a href="/products">Products</a></li>
        <li><a href="/track-order">Track Order</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul></nav>
      <div class="header-actions">
        <a href="/cart" class="cart-link"><span>Cart</span><span class="cart-count" id="cart-count" style="display:none;">0</span></a>
      </div>
    </div>
  </header>

  <div class="container" style="margin-top:40px; max-width:700px;">
    <div class="section-title"><h2>Contact Us</h2><p>We'd love to hear from you</p></div>
    
    <div id="contact-message"></div>

    <div style="background:#f8f9fa; border-radius:12px; padding:30px; margin-bottom:30px;">
      <form method="POST" action="/contact">
        <div class="form-group">
          <label>Your Name *</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Subject</label>
          <input type="text" name="subject">
        </div>
        <div class="form-group">
          <label>Message *</label>
          <textarea name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Send Message</button>
      </form>
    </div>

    <div style="text-align:center; margin-bottom:40px;">
      <h3>Other Ways to Reach Us</h3>
      <p style="margin-top:12px; color:#666;">Email: {{settings.store_email}}</p>
      <p style="color:#666;">Phone: {{settings.store_phone}}</p>
    </div>
  </div>

  <footer class="footer"><div class="footer-bottom">{{settings.store_footer_text}}</div></footer>
  <script src="/js/store.js"></script>
  <script>
    // Check if message was sent
    const params = new URLSearchParams(window.location.search);
    if (params.get('sent') === '1' || document.referrer.includes('/contact')) {
      // Could show success message
    }
  </script>
</body>
</html>
