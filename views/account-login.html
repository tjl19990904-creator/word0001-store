<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - {{settings.store_name}}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="announcement-bar">{{settings.announcement_bar}}</div>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">{{settings.store_name}}</a>
      <nav><ul class="nav-menu">
        <li><a href="/">Home</a></li>
        <li><a href="/products">Products</a></li>
        <li><a href="/track-order">Track Order</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul></nav>
      <div class="header-actions">
        <a href="/cart" class="cart-link"><span>Cart</span><span class="cart-count" id="cart-count" style="display:none;">0</span></a>
      </div>
    </div>
  </header>

  <div class="container" style="max-width:460px; padding:60px 20px;">
    <h1 style="font-size:1.9em; margin-bottom:8px;">Sign in to your account</h1>
    <p style="color:#667; margin-bottom:24px;">Your cart and orders are tied to your account, so only you can see them.</p>

    <div style="display:{{data.errorDisplay}}; background:#fff1f0; border:1px solid #f5b7b1; color:#a12622; border-radius:8px; padding:12px 14px; margin-bottom:16px; font-size:14px;">{{data.error}}</div>

    <form method="POST" action="/account/login" style="display:flex; flex-direction:column; gap:14px;">
      <input type="hidden" name="next" value="{{data.next}}">
      <div>
        <label for="login-email" style="display:block; font-size:13px; margin-bottom:6px;">Email address</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required value="{{data.email}}"
               style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px;">
      </div>
      <div>
        <label for="login-password" style="display:block; font-size:13px; margin-bottom:6px;">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required
               style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px;">
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Sign in</button>
    </form>

    <p style="margin-top:20px; font-size:14px; color:#667;">
      New customer? <a href="/account/register?next={{data.nextParam}}" style="color:#2e7d32; font-weight:600;">Create an account</a>
    </p>
  </div>

  <footer class="footer"><div class="footer-bottom">{{settings.store_footer_text}}</div></footer>
  <script src="/js/store.js"></script>
</body>
</html>
