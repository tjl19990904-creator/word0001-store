<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{{data.pageTitle}} - {{settings.store_name}}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="announcement-bar">{{settings.announcement_bar}}</div>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">{{settings.store_name}}</a>
      <nav><ul class="nav-menu">
        <li><a href="/">Home</a></li>
        <li><a href="/products">Products</a></li>
        <li><a href="/track-order">Track Order</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul></nav>
      <div class="header-actions">
        <a href="/account" class="account-link">My account</a>
      </div>
    </div>
  </header>

  <div class="container" style="padding:40px 20px 64px; max-width:760px;">
    <h1 style="font-size:1.7em; margin-bottom:6px;">Complete your payment</h1>
    <p style="color:#667; margin-bottom:24px;">Order <strong id="order-number"></strong></p>

    <div id="notice" style="display:none; padding:14px 16px; border-radius:8px; margin-bottom:20px; font-size:14px;"></div>

    <div style="background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:20px 22px; margin-bottom:20px;">
      <div id="items"></div>
      <div style="display:flex; justify-content:space-between; border-top:1px solid #eee; padding-top:12px; margin-top:8px; font-size:18px; font-weight:700;">
        <span>Total</span><span id="total"></span>
      </div>
      <p style="font-size:13px; color:#778; margin-top:10px;" id="ship-to"></p>
    </div>

    <div id="pay-area" style="background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:20px 22px;">
      <h3 style="margin-bottom:14px; font-size:1.05em;">Card payment</h3>
      <div id="payment-element"></div>
      <div id="pay-error" style="display:none; color:#b42318; background:#fef3f2; border:1px solid #fecdca; padding:10px 12px; border-radius:6px; margin-top:14px; font-size:14px;"></div>
      <button id="pay-btn" class="btn btn-primary btn-block btn-lg" style="margin-top:18px;">Pay securely</button>
      <p style="font-size:12px; color:#889; margin-top:12px; text-align:center;">Payments are processed securely by Stripe. Your card details never touch our server.</p>
    </div>
  </div>

  <footer class="footer"><div class="footer-bottom">{{settings.store_footer_text}}</div></footer>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    var order = {{data:json:order}};
    var items = {{data:json:orderItems}} || [];
    var payable = {{data:json:payable}};
    var token = {{data:json:token}};
    var message = {{data:json:message}};
    var failureMessage = {{data:json:failureMessage}};
    var declineCode = {{data:json:declineCode}};

    function esc(v) {
      return String(v === undefined || v === null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    document.getElementById('order-number').textContent = order ? order.order_number : '';
    document.getElementById('total').textContent = '$' + Number(order && order.total || 0).toFixed(2);
    if (order && order.shipping_city) {
      document.getElementById('ship-to').textContent = 'Ships to ' + order.shipping_city + (order.shipping_country ? ', ' + order.shipping_country : '');
    }

    document.getElementById('items').innerHTML = (items || []).map(function (item) {
      return '<div style="display:flex; gap:12px; padding:10px 0; border-bottom:1px solid #f4f4f4; align-items:center;">' +
        '<div style="flex:1;">' +
          '<div style="font-weight:600;">' + esc(item.product_name) + '</div>' +
          '<div style="font-size:13px; color:#777;">Qty ' + esc(item.quantity) + ' × $' + Number(item.price || 0).toFixed(2) + '</div>' +
        '</div>' +
        '<div style="font-weight:600;">$' + Number(item.total || 0).toFixed(2) + '</div>' +
      '</div>';
    }).join('');

    var notice = document.getElementById('notice');
    function showNotice(text, kind) {
      if (!text) return;
      var styles = {
        ok: 'background:#ecfdf3; border:1px solid #abefc6; color:#067647;',
        warn: 'background:#fffaeb; border:1px solid #fedf89; color:#b54708;',
        error: 'background:#fef3f2; border:1px solid #fecdca; color:#b42318;'
      };
      notice.setAttribute('style', 'display:block; padding:14px 16px; border-radius:8px; margin-bottom:20px; font-size:14px;' + (styles[kind] || styles.warn));
      notice.textContent = text;
    }

    if (order && order.payment_status === 'paid') {
      showNotice(message || 'Payment received.', 'ok');
    } else if (message) {
      showNotice(message, 'warn');
    } else if (failureMessage) {
      showNotice('Previous attempt: ' + failureMessage + (declineCode ? ' (' + declineCode + ')' : ''), 'error');
    }

    if (!payable) {
      document.getElementById('pay-area').style.display = 'none';
    } else {
      var payBtn = document.getElementById('pay-btn');
      var errorEl = document.getElementById('pay-error');
      var stripeClient = null;
      var elements = null;
      var currentIntentId = null;

      function showError(text) {
        errorEl.textContent = text;
        errorEl.style.display = 'block';
      }

      async function initPayment() {
        payBtn.disabled = true;
        payBtn.textContent = 'Preparing secure payment...';
        try {
          var response = await fetch('/pay/' + encodeURIComponent(token) + '/intent', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}'
          });
          var result = await response.json();
          if (!response.ok || !result.success || !result.clientSecret) {
            throw new Error(result.error || 'Unable to start the payment.');
          }
          currentIntentId = result.paymentIntentId;
          stripeClient = Stripe(result.publishableKey);
          elements = stripeClient.elements({ clientSecret: result.clientSecret });
          elements.create('payment').mount('#payment-element');
          payBtn.disabled = false;
          payBtn.textContent = 'Pay $' + Number(order.total || 0).toFixed(2) + ' securely';
        } catch (error) {
          showError(error.message || 'Unable to start the payment.');
          payBtn.disabled = true;
          payBtn.textContent = 'Payment unavailable';
        }
      }

      payBtn.addEventListener('click', async function () {
        if (!stripeClient || !elements) return;
        errorEl.style.display = 'none';
        payBtn.disabled = true;
        payBtn.textContent = 'Processing...';
        try {
          var result = await stripeClient.confirmPayment({
            elements: elements,
            confirmParams: { return_url: window.location.origin + '/pay/' + encodeURIComponent(token) + '?redirect=1' },
            redirect: 'if_required'
          });
          if (result.error) throw new Error(result.error.message || 'Payment failed.');
          var intent = result.paymentIntent;
          if (!intent) throw new Error('Stripe did not return a payment status.');

          if (intent.status === 'processing') {
            showNotice('Your bank is still processing this payment. Refresh this page in a moment.', 'warn');
            payBtn.disabled = true;
            payBtn.textContent = 'Processing';
            return;
          }
          if (intent.status !== 'succeeded') {
            throw new Error('The payment was not completed. Please try another card.');
          }

          var confirm = await fetch('/pay/' + encodeURIComponent(token) + '/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentIntentId: intent.id })
          });
          var confirmResult = await confirm.json();
          if (!confirm.ok || !confirmResult.success) throw new Error(confirmResult.error || 'Payment confirmation is delayed.');
          window.location.href = '/pay/' + encodeURIComponent(token) + '?paid=1';
        } catch (error) {
          showError(error.message || 'Payment failed. Please try again.');
          payBtn.disabled = false;
          payBtn.textContent = 'Pay $' + Number(order.total || 0).toFixed(2) + ' securely';
        }
      });

      initPayment();
    }
  </script>
</body>
</html>
