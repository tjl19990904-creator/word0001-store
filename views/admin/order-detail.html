<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单详情 - {{settings.store_name}} 管理后台</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar">
        <div class="page-title">订单详情</div>
        <div class="topbar-actions">
          <div class="admin-user"><div class="admin-avatar">A</div><span>admin</span></div>
          <a href="/admin/logout" class="btn-admin btn-admin-secondary btn-admin-sm">退出登录</a>
        </div>
      </div>
      <div class="admin-content">
        <a href="/admin/orders" class="btn-admin btn-admin-secondary btn-admin-sm" style="margin-bottom:16px;">&larr; 返回订单列表</a>

        <div class="order-detail-grid">
          <!-- Left: Order Info -->
          <div>
            <!-- Failed payment handling -->
            <div id="payment-issue-card"></div>

            <!-- Order Status Update -->
            <div class="admin-card">
              <div class="admin-card-header"><h3>订单状态</h3></div>
              <form method="POST" action="/admin/orders/{{data.order.id}}/status" style="display:flex; gap:12px; flex-wrap:wrap;">
                <div class="form-group" style="flex:1; margin-bottom:0;">
                  <label>订单状态</label>
                  <select name="status" id="status-select"></select>
                </div>
                <div class="form-group" style="flex:1; margin-bottom:0;">
                  <label>付款状态</label>
                  <select name="payment_status" id="payment-select"></select>
                </div>
                <div style="display:flex; align-items:flex-end;">
                  <button type="submit" class="btn-admin btn-admin-primary">更新</button>
                </div>
              </form>
            </div>

            <!-- Order Items -->
            <div class="admin-card">
              <div class="admin-card-header"><h3>订单商品</h3></div>
              <div id="items-container"></div>
            </div>

            <!-- Shipping Info -->
            <div class="admin-card">
              <div class="admin-card-header"><h3>收货信息</h3></div>
              <div id="shipping-info"></div>
            </div>
          </div>

          <!-- Right: Summary -->
          <div>
            <div class="admin-card">
              <div class="admin-card-header"><h3>订单摘要</h3></div>
              <div id="order-summary"></div>
            </div>

            <div class="admin-card" id="shipment-card"></div>

            <div class="admin-card" id="tracking-card"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/admin.js"></script>
  <script>
    renderSidebar('orders');
    const order = {{data:json:order}};
    const orderItems = {{data:json:orderItems}};
    const shipment = {{data:json:shipment}};
    const trackingHistory = {{data:json:trackingHistory}};
    const paymentAccount = {{data:json:paymentAccount}};
    const paymentLink = {{data:json:paymentLink}};

    // 状态翻译映射
    const statusMap = {
      'pending': '待处理',
      'processing': '处理中',
      'shipped': '已发货',
      'delivered': '已送达',
      'cancelled': '已取消',
      'in_transit': '运输中',
      'returned': '已退回',
      'out_for_delivery': '派送中'
    };
    const payStatusMap = {
      'unpaid': '未付款',
      'pending': '待付款',
      'paid': '已付款',
      'refunded': '已退款',
      'failed': '付款失败'
    };

    // Status select
    const statuses = ['pending', 'processing', 'shipped', 'delivered', 'cancelled'];
    const statusSelect = document.getElementById('status-select');
    statusSelect.innerHTML = statuses.map(s => `<option value="${s}" ${order.status === s ? 'selected' : ''}>${statusMap[s] || s}</option>`).join('');

    // Payment select
    const payStatuses = ['unpaid', 'pending', 'paid', 'refunded', 'failed'];
    const paySelect = document.getElementById('payment-select');
    paySelect.innerHTML = payStatuses.map(s => `<option value="${s}" ${order.payment_status === s ? 'selected' : ''}>${payStatusMap[s] || s}</option>`).join('');

    // Order summary
    document.getElementById('order-summary').innerHTML = `
      <div style="margin-bottom:12px;"><strong>订单编号：</strong><br>${order.order_number}</div>
      <div style="margin-bottom:12px;"><strong>下单时间：</strong><br>${new Date(order.created_at).toLocaleString()}</div>
      <div style="margin-bottom:12px;"><strong>客户信息：</strong><br>${order.customer_name || '—'}<br>${order.customer_email || '—'}<br>联系电话：${order.customer_phone || '—'}</div>
      <hr style="border:none;border-top:1px solid #e2e8f0;margin:12px 0;">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>商品小计：</span><span>$${order.subtotal.toFixed(2)}</span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>运费：</span><span>$${order.shipping_cost.toFixed(2)}</span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>税费：</span><span>$${order.tax.toFixed(2)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;border-top:1px solid #e2e8f0;padding-top:8px;"><span>总计：</span><span>$${order.total.toFixed(2)}</span></div>
      ${paymentAccount ? `<div style="margin-top:12px;padding:8px;background:#f1f5f9;border-radius:6px;"><strong>支付方式：</strong> ${paymentAccount.name} (${paymentAccount.type})</div>` : `<div style="margin-top:12px;"><strong>支付方式：</strong> ${order.payment_method || '无'}</div>`}
      ${order.notes ? `<div style="margin-top:12px;padding:8px;background:#fef3c7;border-radius:6px;"><strong>备注：</strong> ${order.notes}</div>` : ''}
    `;

    // Order items
    document.getElementById('items-container').innerHTML = `
      <table class="admin-table">
        <thead><tr><th>图片</th><th>商品</th><th>单价</th><th>数量</th><th>小计</th></tr></thead>
        <tbody>
          ${orderItems.map(item => `
            <tr>
              <td>${item.product_image ? `<img src="${item.product_image}" class="product-thumb">` : '-'}</td>
              <td>${item.product_name}</td>
              <td>$${item.price.toFixed(2)}</td>
              <td>${item.quantity}</td>
              <td>$${item.total.toFixed(2)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;

    // Shipping info
    document.getElementById('shipping-info').innerHTML = `
      <div style="margin-bottom:8px;"><strong>收件人：</strong><br>${order.shipping_address || '—'}</div>
      <div style="margin-bottom:8px;"><strong>城市：</strong> ${order.shipping_city}</div>
      <div style="margin-bottom:8px;"><strong>省份/州：</strong> ${order.shipping_state}</div>
      <div style="margin-bottom:8px;"><strong>邮编：</strong> ${order.shipping_zip}</div>
      <div><strong>国家：</strong> ${order.shipping_country}</div>
    `;

    // Shipment card
    const shipCard = document.getElementById('shipment-card');
    if (shipment) {
      shipCard.innerHTML = `
        <div class="admin-card-header"><h3>物流信息</h3>
          <a href="/admin/shipments/${shipment.id}" class="btn-admin btn-admin-secondary btn-admin-sm">管理物流</a>
        </div>
        <div style="margin-bottom:8px;"><strong>物流单号：</strong> ${shipment.tracking_number || '未设置'}</div>
        <div style="margin-bottom:8px;"><strong>承运商：</strong> ${shipment.carrier || '未设置'}</div>
        <div style="margin-bottom:8px;"><strong>状态：</strong> <span class="badge ${shipment.status === 'delivered' ? 'badge-success' : shipment.status === 'shipped' ? 'badge-info' : 'badge-warning'}">${statusMap[shipment.status] || shipment.status}</span></div>
        ${shipment.shipped_at ? `<div style="margin-bottom:8px;"><strong>发货时间：</strong> ${new Date(shipment.shipped_at).toLocaleString()}</div>` : ''}
        ${shipment.delivered_at ? `<div style="margin-bottom:8px;"><strong>送达时间：</strong> ${new Date(shipment.delivered_at).toLocaleString()}</div>` : ''}
      `;
    } else {
      shipCard.innerHTML = `
        <div class="admin-card-header"><h3>物流信息</h3></div>
        <p style="color:#999;">暂无物流记录。</p>
      `;
    }

    // Tracking history
    const trackCard = document.getElementById('tracking-card');
    if (trackingHistory && trackingHistory.length > 0) {
      trackCard.innerHTML = `
        <div class="admin-card-header"><h3>物流跟踪记录</h3></div>
        <div class="tracking-timeline">
          ${trackingHistory.map((e, i) => `
            <div class="tracking-event ${i === 0 ? 'active' : ''}">
              <div class="event-status">${statusMap[e.status] || e.status}</div>
              <div class="event-time">${new Date(e.timestamp).toLocaleString()}</div>
              ${e.location ? `<div class="event-desc">位置：${e.location}</div>` : ''}
              ${e.description ? `<div class="event-desc">${e.description}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    } else {
      trackCard.style.display = 'none';
    }

    // ===== 付款异常处理 =====
    const noticeMap = {
      marked_paid: ['已标记为已付款。', 'ok'],
      cancelled: ['订单已取消。', 'ok'],
      already_paid: ['该订单已经是已付款状态，无需重复操作。', 'warn'],
      reference_required: ['请填写付款凭证号（银行流水号 / 交易号）后再标记已付款。', 'danger']
    };
    const query = new URLSearchParams(window.location.search);
    const noticeKey = query.get('notice') || query.get('error');

    function esc(v) {
      return String(v === undefined || v === null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function paymentIssueCard() {
      const host = document.getElementById('payment-issue-card');
      if (!host) return;
      if (order.payment_status === 'paid') { host.innerHTML = ''; return; }

      const failed = order.payment_status === 'failed';
      const stripeUrl = order.transaction_id && String(order.transaction_id).startsWith('pi_')
        ? 'https://dashboard.stripe.com/payments/' + encodeURIComponent(order.transaction_id)
        : '';

      let html = '<div class="admin-card" style="border-left:4px solid ' + (failed ? '#d92d20' : '#f79009') + ';">';
      html += '<div class="admin-card-header"><h3>付款异常处理</h3>';
      html += '<span class="badge ' + (failed ? 'badge-danger' : 'badge-warning') + '">' + (failed ? '付款失败' : '未完成付款') + '</span></div>';

      if (failed) {
        html += '<div style="background:#fef3f2;border:1px solid #fecdca;border-radius:8px;padding:14px 16px;margin-bottom:14px;">';
        html += '<div style="color:#b42318;font-weight:600;margin-bottom:6px;">' +
          esc(order.payment_failure_message || '支付未完成（未记录具体原因，点击下方“同步 Stripe 状态”可获取）') + '</div>';
        html += '<div style="font-size:13px;color:#7a271a;line-height:1.9;">';
        if (order.payment_failure_decline_code || order.payment_failure_code) {
          html += '错误代码：<strong>' + esc(order.payment_failure_decline_code || order.payment_failure_code) + '</strong><br>';
        }
        if (order.payment_failure_at) html += '失败时间：' + new Date(order.payment_failure_at).toLocaleString() + '<br>';
        if (order.payment_attempts) html += '失败次数：' + esc(order.payment_attempts) + ' 次<br>';
        html += '</div></div>';
      } else {
        html += '<p style="color:#667;margin-bottom:14px;">客户尚未完成付款。可生成支付链接发给客户，或先与客户确认。</p>';
      }

      html += '<div style="margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;">';
      html += '<button class="btn-admin btn-admin-primary btn-admin-sm" id="btn-gen-link">生成 / 刷新支付链接</button>';
      if (stripeUrl) {
        html += '<a class="btn-admin btn-admin-secondary btn-admin-sm" href="' + stripeUrl + '" target="_blank" rel="noopener">在 Stripe 查看</a>';
      }
      html += '</div>';

      html += '<div id="link-box" style="display:none;margin-bottom:14px;">';
      html += '<label style="font-size:13px;color:#475467;">把下面的链接发给客户，客户可直接用原订单付款（7 天有效）</label>';
      html += '<div style="display:flex;gap:8px;margin-top:6px;">';
      html += '<input id="link-input" readonly style="flex:1;padding:9px 10px;border:1px solid #d0d5dd;border-radius:6px;font-size:13px;">';
      html += '<button class="btn-admin btn-admin-secondary btn-admin-sm" id="btn-copy-link">复制</button></div>';
      html += '</div>';

      html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;">';
      html += '<button class="btn-admin btn-admin-secondary btn-admin-sm" id="btn-sync">同步 Stripe 状态</button>';
      html += '<button class="btn-admin btn-admin-secondary btn-admin-sm" id="btn-manual">手动标记已付款</button>';
      html += '<form method="POST" action="/admin/orders/' + order.id + '/payment/cancel" onsubmit="return confirm(\'确定取消该订单？\');" style="display:inline;">';
      html += '<button type="submit" class="btn-admin btn-admin-danger btn-admin-sm">取消订单</button></form>';
      html += '</div>';

      html += '<div id="manual-box" style="display:none;border-top:1px solid #eaecf0;padding-top:14px;">';
      html += '<form method="POST" action="/admin/orders/' + order.id + '/payment/mark-paid">';
      html += '<div class="form-group"><label>付款凭证号（必填）</label>';
      html += '<input name="reference" required placeholder="银行流水号 / 交易号 / 收款记录编号"></div>';
      html += '<div class="form-group"><label>备注（选填）</label>';
      html += '<input name="note" placeholder="例如：客户通过银行转账支付"></div>';
      html += '<button type="submit" class="btn-admin btn-admin-primary btn-admin-sm">确认标记为已付款</button>';
      html += '</form></div>';

      html += '<div id="issue-msg" style="display:none;margin-top:10px;font-size:13px;"></div>';
      html += '</div>';
      host.innerHTML = html;

      const msg = document.getElementById('issue-msg');
      const showMsg = (text, color) => {
        msg.textContent = text;
        msg.style.display = 'block';
        msg.style.color = color || '#475467';
      };

      document.getElementById('btn-gen-link').addEventListener('click', async () => {
        const btn = document.getElementById('btn-gen-link');
        btn.disabled = true;
        try {
          const response = await fetch('/admin/orders/' + order.id + '/payment/link', {
            method: 'POST', headers: { 'Accept': 'application/json' }
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || '生成失败');
          document.getElementById('link-box').style.display = 'block';
          document.getElementById('link-input').value = result.url;
          showMsg('链接已生成，有效期至 ' + new Date(result.expiresAt).toLocaleString(), '#067647');
        } catch (error) {
          showMsg(error.message, '#b42318');
        }
        btn.disabled = false;
      });

      document.getElementById('btn-copy-link').addEventListener('click', async () => {
        const input = document.getElementById('link-input');
        try {
          await navigator.clipboard.writeText(input.value);
          showMsg('已复制到剪贴板', '#067647');
        } catch (error) {
          input.select();
          document.execCommand('copy');
          showMsg('已复制', '#067647');
        }
      });

      document.getElementById('btn-sync').addEventListener('click', async () => {
        const btn = document.getElementById('btn-sync');
        btn.disabled = true;
        btn.textContent = '同步中...';
        try {
          const response = await fetch('/admin/orders/' + order.id + '/payment/sync', {
            method: 'POST', headers: { 'Accept': 'application/json' }
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || '同步失败');
          if (result.result === 'paid') { location.reload(); return; }
          if (result.result === 'failed') {
            showMsg('Stripe 状态：付款失败 — ' + (result.failureMessage || '') +
              (result.declineCode ? ' (' + result.declineCode + ')' : ''), '#b42318');
            setTimeout(() => location.reload(), 1500);
          } else {
            showMsg('Stripe 状态：' + (result.paymentStatus || result.result), '#475467');
            setTimeout(() => location.reload(), 900);
          }
        } catch (error) {
          showMsg(error.message, '#b42318');
        }
        btn.disabled = false;
        btn.textContent = '同步 Stripe 状态';
      });

      document.getElementById('btn-manual').addEventListener('click', () => {
        const box = document.getElementById('manual-box');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
      });

      if (paymentLink) {
        document.getElementById('link-box').style.display = 'block';
        document.getElementById('link-input').value = paymentLink;
      }
    }

    if (noticeKey && noticeMap[noticeKey]) {
      const alertEl = document.createElement('div');
      alertEl.textContent = noticeMap[noticeKey][0];
      const kind = noticeMap[noticeKey][1];
      alertEl.style.cssText = 'padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;' +
        (kind === 'danger'
          ? 'background:#fef3f2;color:#b42318;border:1px solid #fecdca;'
          : kind === 'warn'
            ? 'background:#fffaeb;color:#b54708;border:1px solid #fedf89;'
            : 'background:#ecfdf3;color:#067647;border:1px solid #abefc6;');
      const content = document.querySelector('.admin-content');
      if (content) content.prepend(alertEl);
    }

    paymentIssueCard();
  </script>
</body>
</html>
