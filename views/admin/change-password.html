<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修改密码 - {{settings.store_name}} 管理后台</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar">
        <div class="page-title">修改密码</div>
        <div class="topbar-actions">
          <div class="admin-user"><div class="admin-avatar">A</div><span>admin</span></div>
          <a href="/admin/logout" class="btn-admin btn-admin-secondary btn-admin-sm">退出登录</a>
        </div>
      </div>
      <div class="admin-content">
        <div id="msg"></div>
        <div class="admin-card" style="max-width:500px;">
          <div class="admin-card-header"><h3>修改密码</h3></div>
          <form method="POST" action="/admin/change-password">
            <div class="form-group">
              <label>当前密码</label>
              <input type="password" name="current_password" required>
            </div>
            <div class="form-group">
              <label>新密码</label>
              <input type="password" name="new_password" required minlength="6">
            </div>
            <div class="form-group">
              <label>确认新密码</label>
              <input type="password" name="confirm_password" required minlength="6">
            </div>
            <button type="submit" class="btn-admin btn-admin-primary btn-admin-lg">修改密码</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/admin.js"></script>
  <script>
    renderSidebar('change-password');
    const error = "{{data.error}}";
    const success = "{{data.success}}";
    if (error) {
      document.getElementById('msg').innerHTML = '<div class="badge badge-danger" style="padding:12px 20px;font-size:14px;display:block;margin-bottom:16px;">' + error + '</div>';
    }
    if (success === 'true') {
      document.getElementById('msg').innerHTML = '<div class="badge badge-success" style="padding:12px 20px;font-size:14px;display:block;margin-bottom:16px;">密码修改成功！</div>';
    }
  </script>
</body>
</html>
