<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物流管理 - {{settings.store_name}} 管理后台</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar">
        <div class="page-title">物流管理</div>
        <div class="topbar-actions">
          <div class="admin-user"><div class="admin-avatar">A</div><span>admin</span></div>
          <a href="/admin/logout" class="btn-admin btn-admin-secondary btn-admin-sm">退出登录</a>
        </div>
      </div>
      <div class="admin-content">
        <div class="admin-card">
          <div class="admin-card-header"><h3>物流列表</h3></div>
          <div class="filters-bar">
            <form method="GET" action="/admin/shipments" style="display:flex;gap:8px;">
              <select name="status" id="status-filter" onchange="this.form.submit()">
                <option value="all">全部状态</option>
                <option value="pending">待处理</option>
                <option value="processing">处理中</option>
                <option value="shipped">已发货</option>
                <option value="in_transit">运输中</option>
                <option value="delivered">已送达</option>
                <option value="returned">已退回</option>
              </select>
            </form>
          </div>
          <div style="overflow-x:auto;">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th><th>订单号</th><th>客户</th>
                  <th>物流单号</th><th>承运商</th><th>状态</th><th>操作</th>
                </tr>
              </thead>
              <tbody id="shipments-table"></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/admin.js"></script>
  <script>
    renderSidebar('shipments');
    const shipments = {{data:json:shipments}};
    const currentPage = {{data.currentPage}};
    const totalPages = {{data.totalPages}};
    const statusFilter = "{{data.status}}";

    const statusMap = {
      'pending': '待处理',
      'processing': '处理中',
      'shipped': '已发货',
      'in_transit': '运输中',
      'delivered': '已送达',
      'returned': '已退回'
    };

    // Fix status filter
    document.querySelectorAll('select[name="status"] option').forEach(opt => {
      opt.selected = opt.value === statusFilter;
    });

    const tbody = document.getElementById('shipments-table');
    if (shipments.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;padding:20px;">暂无物流记录。</td></tr>';
    } else {
      tbody.innerHTML = shipments.map(s => `
        <tr>
          <td>${s.id}</td>
          <td><strong>${s.order_number || '无'}</strong></td>
          <td>${s.customer_name || ''}<br><span style="font-size:12px;color:#64748b;">${s.customer_email || ''}</span></td>
          <td>${s.tracking_number || '<span style="color:#999;">未设置</span>'}</td>
          <td>${s.carrier || '-'}</td>
          <td><span class="badge ${s.status === 'delivered' ? 'badge-success' : s.status === 'shipped' || s.status === 'in_transit' ? 'badge-info' : s.status === 'returned' ? 'badge-danger' : 'badge-warning'}">${statusMap[s.status] || s.status}</span></td>
          <td><a href="/admin/shipments/${s.id}" class="action-btn">管理</a></td>
        </tr>
      `).join('');
    }

    // Pagination
    const pagEl = document.getElementById('pagination');
    if (pagEl && totalPages > 1) {
      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        const params = new URLSearchParams();
        if (statusFilter && statusFilter !== 'all') params.set('status', statusFilter);
        params.set('page', i);
        html += `<a href="/admin/shipments?${params.toString()}" class="${i === currentPage ? 'active' : ''}">${i}</a>`;
      }
      pagEl.innerHTML = html;
    }
  </script>
</body>
</html>
